# Centralise every dependency version for the four modules.
#
# Treat entries tagged DEBT as dead or obsolete libraries kept only to reach a
# green build. Remove them during the dependency clean-up stage.

[versions]
slf4j = "2.0.17"
logback = "1.5.18"
guava = "33.4.8-jre"
commons-io = "2.19.0"
commons-lang = "2.6"          # DEBT: keep org.apache.commons.lang v2, migrate to lang3
trove4j = "3.0.3"
joda-time = "2.13.1"
quartz = "2.5.0"
javassist = "3.30.2-GA"
mariadb = "3.5.9"
bonecp = "0.8.0.RELEASE"      # DEBT: replace this pool, abandoned since 2013, with HikariCP
jaxb = "4.0.5"
jaxb-api = "4.0.2"
activation = "2.1.3"
jsr305 = "3.0.2"
netty3 = "3.10.6.Final"       # DEBT: upgrade AL-Chat from end-of-life Netty 3 to Netty 4
guice = "7.0.0"
javolution = "5.5.1"          # DEBT: swap FastMap/FastList/FastSet for java.util equivalents

[libraries]
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logback-core = { module = "ch.qos.logback:logback-core", version.ref = "logback" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
commons-lang = { module = "commons-lang:commons-lang", version.ref = "commons-lang" }
trove4j = { module = "net.sf.trove4j:trove4j", version.ref = "trove4j" }
joda-time = { module = "joda-time:joda-time", version.ref = "joda-time" }
quartz = { module = "org.quartz-scheduler:quartz", version.ref = "quartz" }
javassist = { module = "org.javassist:javassist", version.ref = "javassist" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
bonecp = { module = "com.jolbox:bonecp", version.ref = "bonecp" }
jaxb-api = { module = "jakarta.xml.bind:jakarta.xml.bind-api", version.ref = "jaxb-api" }
jaxb-runtime = { module = "org.glassfish.jaxb:jaxb-runtime", version.ref = "jaxb" }
activation = { module = "jakarta.activation:jakarta.activation-api", version.ref = "activation" }
jsr305 = { module = "com.google.code.findbugs:jsr305", version.ref = "jsr305" }
netty3 = { module = "io.netty:netty", version.ref = "netty3" }
guice = { module = "com.google.inject:guice", version.ref = "guice" }
javolution = { module = "javolution:javolution", version.ref = "javolution" }

[bundles]
logging = ["slf4j-api", "logback-classic", "logback-core"]
jaxb = ["jaxb-api", "jaxb-runtime", "activation"]
