# ==========================================
# Geodata config's:
# ==========================================

# Read the geodata under data/geo and answer ground heights from it.
# Default: false
#
# The geodata is distributed separately, so data/geo is empty in a fresh clone.
# Off, the world has no shape: the ground is wherever whoever asked already
# stood, and nothing blocks sight or movement. Login, character creation and
# world entry all work either way.
#
# On, the ground comes from the height grid the client ships, one directory per
# world id under data/geo. A world with no directory is answered as if this were
# off. Sight and movement are not served yet, on or off.
gameserver.geodata.enable = false

# Enable fear skill using geodata.
# Default: true
gameserver.geodata.fear.enable = true

# If enabled - during movements npcs will be checking z coordinate based on geo if target is flying
# Default: false
gameserver.geo.npc.move = true

# Show collision zone name and skill id for GMs
# Default: false
gameserver.geo.materials.showdetails = false

# Enable geodata shields, for test purpose
# Default: false
gameserver.geo.shields.enable = false
