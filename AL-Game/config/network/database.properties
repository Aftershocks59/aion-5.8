# ==========================================
# 		  DATABASE CONFIGURATIONS
# ==========================================

# This class represents database driver class that will be used while connecting to database
database.driver = org.mariadb.jdbc.Driver

# This is database url.
# Override the host, port and database name through the environment.
database.url = jdbc:mariadb://${AION_DB_HOST:localhost}:${AION_DB_PORT:3306}/${AION_GS_DB_NAME:al_server_gs}?useUnicode=true&characterEncoding=UTF-8&sslMode=disable

# Database user
# Supply the real value through the AION_DB_USER environment variable.
database.user = ${AION_DB_USER:root}

# Database password
# NEVER store a real password here. Supply it through the AION_DB_PASSWORD
# environment variable or a JVM system property of the same name; this file is
# tracked in version control.
database.password = ${AION_DB_PASSWORD:}

# Number of partitions created by bonecp
database.bonecp.partition.count = 2

# Minimal amount of connections kept in bonecp partition
database.bonecp.partition.connections.min = 2

# Maximal amount of connections kept in bonecp partition
database.bonecp.partition.connections.max = 5

# Script context that will be loaded by database factory, it should implement DAO instances
database.scriptcontext.descriptor = ./data/scripts/system/database.xml